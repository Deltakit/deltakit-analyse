[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "deltakit-analyse"
version = "0.1.0"
description = "Deltakit (component deltakit-analyse)"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [{ name = "Deltakit Team", email = "deltakit@riverlane.com" }]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]

dependencies = [
  "deltakit-core>=0.9.0",
  "deltakit-circuit>=0.9.0",
  "deltakit-decode>=0.9.2",
  "numpy >=2,<3",
  "numpy>=2.1,<3; python_version >= '3.13'",
  "numpy>=2.3.2,<3; python_version >= '3.14'",
  "numpy>=2.5.2,<3; python_version >= '3.15'",
  "scipy >=1.15.3, <2",
  "scipy >=1.16.2, <2; python_version >= '3.14'",
  "pandas >=2.2.2, <4",
  "pandas >=2.3.3, <4; python_version >= '3.13'",
  "pandas >=3.0.6, <4; python_version >= '3.15'",
  # >=3.2.3: earlier 3.2 releases import the deprecated ``numpy.core`` in
  # ``unumpy``, which fails under the test suite's ``filterwarnings = error``.
  "uncertainties>=3.2.3,<4",
  "adjustText >=1.3, <2",
  "matplotlib >=3.9.2, <4; python_version < '3.14'",
  "matplotlib >=3.10.5, <4; python_version >= '3.14'",
  "matplotlib >=3.11.2, <4; python_version >= '3.15'",
  "tqdm >=4.66.3, <5",
]

[project.optional-dependencies]
vis = ["seaborn>=0.13,<0.14"]

[project.urls]
Homepage = "https://github.com/riverlane/deltakit-analyse"
Source = "https://github.com/riverlane/deltakit-analyse"
Documentation = "https://deltakit.riverlane.com/"
Issues = "https://github.com/riverlane/deltakit-analyse/issues"
Changelog = "https://github.com/riverlane/deltakit-analyse/releases"


[dependency-groups]
stubs = [
  "scipy-stubs",
  "pandas-stubs",
  "types-networkx",
  "types-seaborn",
  "types-tqdm",
]
test = [
  "pytest >=9.0.3, <10",
  "pytest-cov >=7, <8",
  "pytest-mock >=3.14, <4",
  "pytest-skip-slow>=0.0.5,<1.2",
  "coverage >=7.7.0, <8",
  "pytest-lazy-fixtures >=1, <2",
  "deltakit-explorer>=0.9.4,<0.10",
]
lint = [
  { include-group = "stubs" },
  "mypy >=1.17, <3",
  "ruff==0.17.3",
  "typos >=1.34, <2",
  "deptry>=0.23,<0.26",
  "pydoclint>=0.8.6,<0.13",
]
security = ["bandit[toml] >=1.8, <2", "pip-audit >=2.7, <3"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "security" },
  { include-group = "release" },
  "pre-commit >=4.7, <5",
  "validate-pyproject>=0.24.1,<0.28",
]
release = ["packaging >=25.0, <27", "tomlkit<0.16,>=0.14"]

[tool.typos.default]
extend-ignore-re = [
  # Ignore jupyter notebook cell IDs
  "\"id\"\\s*:\\s*\"[0-9a-f]{8,}\"",
]

[tool.typos.default.extend-words]
CPY = "CPY" # A ruff rule identifier

[tool.typos.files]
# Paths/patterns to exclude from spell checking
extend-exclude = [
  "docs/styles",
  "**/LICENSE",
  "**/*.html",
  "licenses.confluence",
  "CHANGELOG.md",
]

[tool.deptry]
known_first_party = ["deltakit_analyse"]
extend_exclude = ["tools/"]


[tool.mypy]
files = "src/**/*.py"
# The below list of disabled checks should eventually be empty.
enable_error_code = ["deprecated"]

[[tool.mypy.overrides]]
module = ["stim", "adjustText", "uncertainties", "uncertainties.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["./tests/"]

[tool.pydoclint]
style = 'google'
exclude = '\.git|\.venv.*'
# We do not want type hints to be duplicated in docstrings.
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# Ensure that Google style is used
check-style-mismatch = true
# Empty yields or returns do not have to be documented.
require-yield-section-when-yielding-nothing = false
require-return-section-when-returning-nothing = false
# The raise checks are oddly restrictive - forcing us to document exceptions in the function
# body and nothing more.
skip-checking-raises = true
