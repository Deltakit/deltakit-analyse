name: Pull Request

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # Build deltakit wheels.
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Grant access to private repo
        uses: riverlane/devops-resources/.github/actions/private-repo-access@dev
        with:
          username: ${{ secrets.CI_RUNNER_USERNAME }}
          password: ${{ secrets.CI_RUNNER_PASSWORD }}
      - name: Build deltakit-analyse wheel
        env:
          NPM_TOKEN: ${{ secrets.RIV_DEV_BOT_PAT }}
        run: uv build --no-sources .
      - name: Upload deltakit-analyse wheel artefact
        uses: actions/upload-artifact@v7
        with:
          name: deltakit-analyse-wheel
          path: ./dist/*.whl
          retention-days: 7

  # Test the built wheels.
  test-wheels:
    needs: build-wheels
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        dependency-resolution: ['highest', 'lowest-direct']
    name: Test deltakit-analyse on ${{ matrix.python-version }} with ${{matrix.dependency-resolution}}
    env:
      ENABLE_COVERAGE: ${{ (matrix.python-version == '3.11') && (matrix.dependency-resolution == 'highest') }}
      # See https://github.com/orgs/community/discussions/25217
      PR_FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      PR_FROM_DEPENDABOT: ${{ startsWith(github.head_ref, 'dependabot/' )}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Grant access to private repo
        uses: riverlane/devops-resources/.github/actions/private-repo-access@dev
        with:
          username: ${{ secrets.CI_RUNNER_USERNAME }}
          password: ${{ secrets.CI_RUNNER_PASSWORD }}
      - name: Download deltakit-analyse wheel
        uses: actions/download-artifact@v8
        with:
          name: deltakit-analyse-wheel
          path: ./dist
      - name: Setup and sync venv for testing deltakit
        run: |
          uv sync --python ${{ matrix.python-version }} --resolution ${{matrix.dependency-resolution}} --group test --find-links ./dist/
          uv pip install ./dist/*.whl
      - name: Test deltakit-analyse
        env:
          COVERAGE_ARGS: ${{ env.ENABLE_COVERAGE == 'true' && '--cov deltakit_analyse --cov-config pyproject.toml --cov-report xml:coverage.xml' || '' }}
        run: |
          uv run --python ${{ matrix.python-version }} --no-sync pytest $COVERAGE_ARGS tests/
      # Re-enable coverage report when proper tests are in place.
      # - name: Printing coverage report as a message
      #   if: ${{ env.ENABLE_COVERAGE == 'true' && env.PR_FROM_FORK == 'false' && env.PR_FROM_DEPENDABOT == 'false' }}
      #   uses: 5monkeys/cobertura-action@v14
      #   with:
      #     repo_token : ${{ secrets.GITHUB_TOKEN }}
      #     path: ./coverage.xml
      #     skip_covered: true
      #     minimum_coverage: 95
      #     fail_below_threshold: false
      #     show_missing: true
      #     link_missing_lines: true
      #     link_missing_lines_source_dir: ''
      #     only_changed_files: true
  # Perform static check for deltakit-analyse.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Grant access to private repo
        uses: riverlane/devops-resources/.github/actions/private-repo-access@dev
        with:
          username: ${{ secrets.CI_RUNNER_USERNAME }}
          password: ${{ secrets.CI_RUNNER_PASSWORD }}
      - name: Setup venv
        run: uv sync --group=lint --group=security
      - name: Check for typos
        run: uv run --no-sync typos
        if: ${{ always() }}
      - name: Run `ruff` syntax checker
        run: uv run --no-sync ruff check
        if: ${{ always() }}
      - name: Run `ruff` formatting
        run: uv run --no-sync ruff format --check
        if: ${{ always() }}
      - name: Run `pydoclint` documentation formatting
        run: uv run --no-sync pydoclint .
        if: ${{ always() }}
      - name: Run `mypy` type checker
        run: uv run --no-sync mypy
        if: ${{ always() }}
      - name: Run `deptry` for dependency hygiene
        run: uv run --no-sync deptry .
        if: ${{ always() }}
      - name: Run `bandit` for code vulnerabilities
        run: uv run --no-sync bandit .
        if: ${{ always() }}
      - name: Run `pip_audit` to check dependencies for known vulnerabilities
        # Ignore CVE-2025-53000 as it only affects `nbconvert` on Windows.
        # `nbconvert` is only used for documentation building on Linux.
        # Remove when https://github.com/jupyter/nbconvert/issues/2258 is fixed.
        run: |
          uv pip install --upgrade pip
          uv run --no-sync pip-audit --ignore-vuln CVE-2025-53000
        if: ${{ always() }}
        # There is currently an error because pip-audit is not able to find
        # deltakit-compile on PyPI. Until we upload an empty version of
        # deltakit-compile on it, ignore errors because pip-audit does not have any way
        # of ignoring a dependency.
        continue-on-error: true
