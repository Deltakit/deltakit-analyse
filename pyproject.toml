[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "deltakit-analyse"
version = "0.1.0"
description = "Deltakit (component deltakit-analyse)"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [{ name = "Deltakit Team", email = "deltakit@riverlane.com" }]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/riverlane/deltakit-analyse"
Source = "https://github.com/riverlane/deltakit-analyse"
Documentation = "https://deltakit.riverlane.com/"
Issues = "https://github.com/riverlane/deltakit-analyse/issues"
Changelog = "https://github.com/riverlane/deltakit-analyse/releases"


[dependency-groups]
test = [
  "pytest >=9, <10",
  "pytest-cov >=7, <8",
  "pytest-mock >=3.14, <4",
  "pytest-skip-slow>=0.0.5,<1.2",
  "coverage >=7.7.0, <8",
  "pytest-lazy-fixtures >=1, <2",
]
lint = [
  "mypy >=1.17, <3",
  "ruff==0.15.17",
  "typos >=1.34, <2",
  "deptry>=0.23,<0.26",
  "types-networkx >=3.1, <4",
  "pydoclint >=0.8.6, <0.9",
]
security = ["bandit[toml] >=1.8, <2", "pip-audit >=2.7, <3"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "security" },
  { include-group = "release" },
  "pre-commit >=4.2, <5",
  "validate-pyproject >=0.24.1,<0.26",
]
release = [
  "packaging >=25.0, <27",
  "tomlkit<0.16,>=0.14",
  "python-semantic-release >=10.2, <11",
]

[tool.typos.default]
locale = 'en-gb'
extend-ignore-re = [
  # Ignore jupyter notebook cell IDs
  "\"id\"\\s*:\\s*\"[0-9a-f]{8,}\"",
]

[tool.typos.default.extend-words]
# Don't correct "iy" - often used in the context of "probability of an IY operation"
iy = "iy"
iz = "iz"
IZ = "IZ"
anc = "anc"
BA = "BA"
youre = "you're"
distribtuion = "distribution"
interm = "interm"
ket = "ket"
ND = "ND"                         # part of NDArray
Alise = "Alise"
DEPOLARIZE = "DEPOLARIZE"
depolarization = "depolarization"
depolarizing = "depolarizing"
Authorization = "Authorization"   # Web-related field.
color = "color"                   # Used in matplotlib and stim APIs.
colors = "colors"
optimize = "optimize"             # scipy.optimize
ax = "ax"                         # Typical naming for matplotlib Axes instances.
center = "center"
stabilizer = "stabilizer"
stabilizers = "stabilizers"
synchronize = "synchronize"       # multiprocessing import
neighbors = "neighbors"
capitalize = "capitalize"
labeled = "labeled"
labeler = "labeler"
unrealized = "unrealized"
writeable = "writeable"           # Used in numpy APIs.
CPY = "CPY"                       # A ruff rule identifier

[tool.typos.files]
# Paths/patterns to exclude from spell checking
extend-exclude = [
  "docs/styles",
  "**/LICENSE",
  "**/*.html",
  "licenses.confluence",
  "CHANGELOG.md",
]

[tool.deptry]
known_first_party = ["deltakit_analyse"]
ignore = ["DEP003"]
extend_exclude = ["tools/"]

[tool.deptry.per_rule_ignores]
DEP001 = ["lestim"]

[tool.mypy]
files = "src/**/*.py"
# The below list of disabled checks should eventually be empty.
disable_error_code = "dict-item,misc,arg-type,return-value,union-attr,index,attr-defined,call-overload"
enable_error_code = ["deprecated"]

[[tool.mypy.overrides]]
module = ["stim"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["lestim"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["./tests/"]

[tool.pydoclint]
style = 'google'
exclude = '\.git|\.venv.*'
# We do not want type hints to be duplicated in docstrings.
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# Ensure that Google style is used
check-style-mismatch = true
# Empty yields or returns do not have to be documented.
require-yield-section-when-yielding-nothing = false
require-return-section-when-returning-nothing = false
# The raise checks are oddly restrictive - forcing us to document exceptions in the function
# body and nothing more.
skip-checking-raises = true
# For the moment, we have a baseline of documentation format errors. Eventually, this will
# be removed.
baseline = ".pydoclint_baseline.txt"